version: "3.8"

services:
  slides-app:
    image: ghcr.io/ntrampe/slides:latest
    container_name: slides
    # Injects IMMICH_* and DEFAULT_* into process.env (server does not read .env from disk)
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      # Host ./data must exist before first start (see README). Maps to /app/data in the container.
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + (process.env.PORT || 3000), r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 3s
      retries: 3