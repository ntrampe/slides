openapi: 3.1.0
info:
  title: Slides API
  version: "3"
  description: |
    Sync-and-play slideshow API. The server is the source of truth for **configuration
    rules** (`AppSettings` grouped by `query`, `playback`, `configuration`) and a **real-time
    broker** (SSE) for domain-scoped settings updates. The server does not track playback
    state (timers, indices).

    **Kiosk boot:** `GET /meta` → `GET /settings` + `GET /events` (SSE) in parallel →
    `POST /slideshow/query` with query fields from settings → local timer and index.

    **Remote control:** `PATCH /settings/{domain}` (e.g. Home Assistant) broadcasts
    domain events on the SSE stream.

servers:
  - url: /api/v1
    description: Versioned domain API (relative to the Slides host)

paths:

  /meta:
    get:
      operationId: getApiMeta
      summary: API and contract version
      description: |
        Discovery endpoint. Compare `contractVersion` to the version your client was
        built against. Bump OpenAPI `info.version` on breaking JSON changes.
      responses:
        '200':
          description: Version metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMeta'

  /slideshow/query:
    post:
      operationId: postSlideshowQuery
      summary: Query photos for playback
      description: |
        Stateless photo query. Accepts query settings in the JSON body (avoids URL length
        limits for large album ID lists). Returns the full ordered list; shuffle is
        applied server-side when `shuffle` is true. The server does not retain kiosk
        session or playback progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlideshowQueryRequest'
      responses:
        '200':
          description: Ordered photo list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlideshowResponse'
        '400':
          $ref: '#/components/responses/ClientError'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/ServerError'

  /settings:
    get:
      operationId: getSettings
      summary: Effective configuration
      description: |
        Returns the fully effective configuration: `DEFAULT_*` env defaults
        shallow-merged with persisted per-domain overrides (`settings.query.json`,
        `settings.playback.json`, `settings.configuration.json`), then optional URL query
        overrides using bracket notation (e.g. `?query[shuffle]=false&playback[intervalMs]=5000`;
        array values use comma separation `query[albumIds]=id1,id2`). URL overrides are
        session-only and are not persisted. Ignored params: `seed`, `cursor`, `limit`.
      parameters:
        - name: query
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
          description: Example — domain keys may be passed via bracket notation.
      responses:
        '200':
          description: Effective settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSettings'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      operationId: deleteSettings
      summary: Clear all persisted overrides
      description: |
        Removes all persisted overrides (all three domain files), reverting to env defaults.
        Broadcasts `settings_cleared` on SSE.
      responses:
        '200':
          description: Overrides cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Settings overrides cleared

  /settings/query:
    patch:
      operationId: patchQuerySettings
      summary: Partially update query settings overrides
      description: |
        Shallow-merges the partial `QuerySettingsUpdate` body with existing persisted
        query overrides in `settings.query.json` and returns the full effective
        `AppSettings`. Broadcasts `query_updated` on SSE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuerySettingsUpdate'
      responses:
        '200':
          description: Effective settings after update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSettings'
        '400':
          $ref: '#/components/responses/ClientError'

    delete:
      operationId: deleteQuerySettings
      summary: Clear query settings overrides
      description: |
        Removes query overrides, reverting query domain to env defaults.
        Broadcasts `query_updated` on SSE.
      responses:
        '200':
          description: Query overrides cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Query settings overrides cleared

  /settings/playback:
    patch:
      operationId: patchPlaybackSettings
      summary: Partially update playback settings overrides
      description: |
        Shallow-merges the partial `PlaybackSettingsUpdate` body with existing persisted
        playback overrides in `settings.playback.json` and returns the full effective
        `AppSettings`. Broadcasts `playback_updated` on SSE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackSettingsUpdate'
      responses:
        '200':
          description: Effective settings after update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSettings'
        '400':
          $ref: '#/components/responses/ClientError'

    delete:
      operationId: deletePlaybackSettings
      summary: Clear playback settings overrides
      description: |
        Removes playback overrides, reverting playback domain to env defaults.
        Broadcasts `playback_updated` on SSE.
      responses:
        '200':
          description: Playback overrides cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Playback settings overrides cleared

  /settings/configuration:
    patch:
      operationId: patchConfigurationSettings
      summary: Partially update configuration settings overrides
      description: |
        Shallow-merges the partial `ConfigurationSettingsUpdate` body with existing persisted
        configuration overrides in `settings.configuration.json` and returns the full effective
        `AppSettings`. Broadcasts `configuration_updated` on SSE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationSettingsUpdate'
      responses:
        '200':
          description: Effective settings after update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSettings'
        '400':
          $ref: '#/components/responses/ClientError'

    delete:
      operationId: deleteConfigurationSettings
      summary: Clear configuration settings overrides
      description: |
        Removes configuration overrides, reverting configuration domain to env defaults.
        Broadcasts `configuration_updated` on SSE.
      responses:
        '200':
          description: Configuration overrides cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Configuration settings overrides cleared

  /events:
    get:
      operationId: getEvents
      summary: Server-Sent Events stream
      description: |
        Long-lived `text/event-stream` for real-time sync. Clients should treat events as
        invalidation triggers and refetch via `GET /settings` (preserving URL overrides).

        - `event: query_updated` — `data` is JSON `QuerySettings` (persisted query domain).
        - `event: playback_updated` — `data` is JSON `PlaybackSettings`.
        - `event: configuration_updated` — `data` is JSON `ConfigurationSettings`.
        - `event: settings_cleared` — `data` is JSON `AppSettings` (resolved env defaults).

        Comment heartbeats (`: ping`) are sent periodically to keep connections alive.
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /albums:
    get:
      operationId: getAlbums
      summary: List albums
      description: Returns all Immich albums with thumbnail URLs proxied through `/assets`.
      responses:
        '200':
          description: Album list
          content:
            application/json:
              schema:
                type: object
                required: [albums]
                properties:
                  albums:
                    type: array
                    items:
                      $ref: '#/components/schemas/Album'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/ServerError'

  /people:
    get:
      operationId: getPeople
      summary: List people
      description: Returns all named people recognized by Immich with thumbnail URLs proxied through `/assets`.
      responses:
        '200':
          description: People list
          content:
            application/json:
              schema:
                type: object
                required: [people]
                properties:
                  people:
                    type: array
                    items:
                      $ref: '#/components/schemas/Person'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/ServerError'

  /locations:
    get:
      operationId: getLocations
      summary: Location hierarchy
      description: |
        Returns a hierarchy of countries → states → cities derived from photo
        EXIF data. Use this to populate filter pickers.
      responses:
        '200':
          description: Location hierarchy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationHierarchy'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/ServerError'

  /locations/markers:
    get:
      operationId: getLocationMarkers
      summary: Raw map markers
      description: Returns all individual map markers from photo EXIF data.
      responses:
        '200':
          description: Map markers
          content:
            application/json:
              schema:
                type: object
                required: [markers]
                properties:
                  markers:
                    type: array
                    items:
                      $ref: '#/components/schemas/MapMarker'
        '500':
          $ref: '#/components/responses/ServerError'

  /locations/resolve:
    get:
      operationId: resolveLocation
      summary: Resolve a partial location
      parameters:
        - name: country
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: city
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Resolved location or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LocationSelection'
                  - type: 'null'
        '500':
          $ref: '#/components/responses/ServerError'

  /weather:
    get:
      operationId: getWeather
      summary: Current weather
      description: |
        Returns current weather for `configuration.weatherLat` / `configuration.weatherLng` from
        effective settings. Supports bracket-notation URL overrides (e.g.
        `?configuration[weatherLat]=51.5`). Returns `503` when `OWM_KEY` is unset.
      responses:
        '200':
          description: Current weather
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherData'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /assets/{id}/thumbnail:
    get:
      operationId: getAssetThumbnail
      summary: Photo thumbnail (binary)
      description: Proxies the Immich thumbnail for the given asset ID.
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Image bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/AuthError'

  /assets/{id}/video:
    get:
      operationId: getAssetVideo
      summary: Live photo video (binary)
      description: Proxies the Immich live-photo video when `livePhotoEnabled` is true.
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Video bytes
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/AuthError'

components:

  parameters:
    AssetId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Immich asset UUID

  schemas:

    ApiMeta:
      type: object
      required: [apiVersion, contractVersion]
      properties:
        apiVersion:
          type: string
        contractVersion:
          type: string

    SlideshowResponse:
      type: object
      required: [photos, total]
      properties:
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        total:
          type: integer

    SlideshowQueryRequest:
      allOf:
        - $ref: '#/components/schemas/QuerySettings'
        - type: object
          properties:
            seed:
              type: string
              description: Deterministic shuffle seed; omit for random order per query.

    Photo:
      type: object
      required: [id, url, type, createdAt, isFavorite]
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        inAppUrl:
          type: string
          format: uri
        livePhotoVideoUrl:
          type: string
          format: uri
        width:
          type: integer
        height:
          type: integer
        type:
          type: string
          enum: [IMAGE, VIDEO]
        createdAt:
          type: string
          format: date-time
        description:
          type: string
        rating:
          type: integer
          minimum: 0
          maximum: 5
        isFavorite:
          type: boolean
        tags:
          type: array
          items:
            type: string
        location:
          $ref: '#/components/schemas/PhotoLocation'
        camera:
          $ref: '#/components/schemas/PhotoCameraInfo'
        exifSettings:
          $ref: '#/components/schemas/PhotoExifSettings'
        orientation:
          type: string
        duration:
          type: string

    PhotoLocation:
      type: object
      properties:
        city:
          type: string
        state:
          type: string
        country:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    PhotoCameraInfo:
      type: object
      properties:
        make:
          type: string
        model:
          type: string
        lensModel:
          type: string

    PhotoExifSettings:
      type: object
      properties:
        fNumber:
          type: number
        exposureTime:
          type: string
        iso:
          type: integer
        focalLength:
          type: number

    AppSettings:
      type: object
      required: [query, playback, configuration]
      properties:
        query:
          $ref: '#/components/schemas/QuerySettings'
        playback:
          $ref: '#/components/schemas/PlaybackSettings'
        configuration:
          $ref: '#/components/schemas/ConfigurationSettings'

    QuerySettings:
      type: object
      required:
        - albumIds
        - albumOperator
        - personIds
        - personOperator
        - excludeAlbumIds
        - excludePersonIds
        - globalOperator
        - shuffle
      properties:
        albumIds:
          type: array
          items: { type: string }
        albumOperator:
          $ref: '#/components/schemas/FilterOperator'
        personIds:
          type: array
          items: { type: string }
        personOperator:
          $ref: '#/components/schemas/FilterOperator'
        excludeAlbumIds:
          type: array
          items: { type: string }
        excludePersonIds:
          type: array
          items: { type: string }
        locationCountry:
          type: string
        locationState:
          type: string
        locationCity:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        globalOperator:
          $ref: '#/components/schemas/FilterOperator'
        shuffle:
          type: boolean

    PlaybackSettings:
      type: object
      required:
        - intervalMs
        - autoplay
        - layout
        - photoScaleMode
        - transitionType
        - transitionDuration
        - photoAnimationType
        - photoAnimationDuration
        - photoAnimationIntensity
        - livePhotoEnabled
        - livePhotoDelay
      properties:
        intervalMs:
          type: integer
        autoplay:
          type: boolean
        layout:
          type: string
          enum: [single, split]
        photoScaleMode:
          type: string
          enum: [fit_inside, fill_crop, stretch, original]
        transitionType:
          type: string
          enum: [fade, slide, none]
        transitionDuration:
          type: number
        photoAnimationType:
          type: string
          enum: [none, zoom-in, zoom-out, pan, ken-burns]
        photoAnimationDuration:
          type: number
        photoAnimationIntensity:
          type: number
        livePhotoEnabled:
          type: boolean
        livePhotoDelay:
          type: number

    ConfigurationSettings:
      type: object
      required:
        - dateFormat
        - clockUse24HourFormat
        - weatherLat
        - weatherLng
      properties:
        dateFormat:
          type: string
        clockUse24HourFormat:
          type: boolean
        weatherLat:
          type: number
          format: double
        weatherLng:
          type: number
          format: double

    QuerySettingsUpdate:
      type: object
      properties:
        albumIds:
          type: array
          items: { type: string }
        albumOperator:
          $ref: '#/components/schemas/FilterOperator'
        personIds:
          type: array
          items: { type: string }
        personOperator:
          $ref: '#/components/schemas/FilterOperator'
        excludeAlbumIds:
          type: array
          items: { type: string }
        excludePersonIds:
          type: array
          items: { type: string }
        locationCountry:
          type: string
        locationState:
          type: string
        locationCity:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        globalOperator:
          $ref: '#/components/schemas/FilterOperator'
        shuffle:
          type: boolean

    PlaybackSettingsUpdate:
      type: object
      properties:
        intervalMs:
          type: integer
        autoplay:
          type: boolean
        layout:
          type: string
          enum: [single, split]
        photoScaleMode:
          type: string
          enum: [fit_inside, fill_crop, stretch, original]
        transitionType:
          type: string
          enum: [fade, slide, none]
        transitionDuration:
          type: number
        photoAnimationType:
          type: string
          enum: [none, zoom-in, zoom-out, pan, ken-burns]
        photoAnimationDuration:
          type: number
        photoAnimationIntensity:
          type: number
        livePhotoEnabled:
          type: boolean
        livePhotoDelay:
          type: number

    ConfigurationSettingsUpdate:
      type: object
      properties:
        dateFormat:
          type: string
        clockUse24HourFormat:
          type: boolean
        weatherLat:
          type: number
          format: double
        weatherLng:
          type: number
          format: double

    FilterOperator:
      type: string
      enum: [AND, OR]

    Album:
      type: object
      required: [id, name, description, thumbnailUrl, assetCount, createdAt, updatedAt, shared]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnailUrl:
          type: string
          format: uri
        assetCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        shared:
          type: boolean

    Person:
      type: object
      required: [id, name, birthDate, thumbnailUrl, isHidden, isFavorite, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        birthDate:
          type: string
          format: date
          nullable: true
        thumbnailUrl:
          type: string
          format: uri
        isHidden:
          type: boolean
        isFavorite:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    LocationHierarchy:
      type: object
      required: [countries, states, cities]
      properties:
        countries:
          type: array
          items:
            $ref: '#/components/schemas/LocationItem'
        states:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/LocationItem'
        cities:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/LocationItem'

    LocationSelection:
      type: object
      properties:
        country:
          type: string
        state:
          type: string
        city:
          type: string

    LocationItem:
      type: object
      required: [id, name, count]
      properties:
        id:
          type: string
        name:
          type: string
        count:
          type: integer

    MapMarker:
      type: object
      required: [id, lat, lon, city, state, country]
      properties:
        id:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        city:
          type: string
        state:
          type: string
        country:
          type: string

    WeatherData:
      type: object
      required: [temp, condition, city]
      properties:
        temp:
          type: number
        condition:
          type: string
          enum: [sunny, cloudy, rainy, snowy, stormy]
        city:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            type:
              type: string
              enum: [network, auth, client, server]
            message:
              type: string
            code:
              type: string

  responses:
    ClientError:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    AuthError:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
